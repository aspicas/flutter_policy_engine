name: 🚀 Main Branch Pipeline

on:
  pull_request:
    branches:
      - main

jobs:
  # Step 1: Validate merge source
  validate-resource:
    name: Validate merge source
    runs-on: ubuntu-latest
    outputs:
      validated: ${{ steps.validate.outputs.result }}
    steps:
      - name: Check source branch
        id: validate
        run: |
          if [ "${{ github.head_ref }}" != "develop" ]; then
            echo "Error: Only develop branch can merge to main"
            echo "result=failure" >> $GITHUB_OUTPUT
            exit 1
          else
            echo "Validation passed - source branch is develop"
            echo "result=success" >> $GITHUB_OUTPUT
          fi

  # Step 2: Domain purity check (domain layer must not import Flutter)
  domain-purity:
    name: Domain Purity Check
    runs-on: ubuntu-latest
    needs: validate-resource
    if: needs.validate-resource.outputs.validated == 'success'
    steps:
      - name: ⬇️ Checkout code
        uses: actions/checkout@v4

      - name: 🔍 Check domain layer has no Flutter imports
        run: |
          if find lib/src/domain -name '*.dart' 2>/dev/null | \
             xargs grep -l "package:flutter/\|dart:ui\|dart:io" 2>/dev/null | grep .; then
            echo "❌ Domain layer contains Flutter/IO imports!"
            exit 1
          else
            echo "✅ Domain layer is pure Dart"
          fi

  # Step 3: Run Flutter tests and enforce coverage
  test:
    name: Flutter Tests & Coverage
    runs-on: ubuntu-latest
    needs: validate-resource
    if: needs.validate-resource.outputs.validated == 'success'
    outputs:
      tests-passed: ${{ steps.run-tests.outputs.result }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.3"
          architecture: "x64"

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --set-exit-if-changed .

      - name: Analyze project source
        run: flutter analyze

      - name: Run tests with coverage
        id: run-tests
        run: |
          flutter test --coverage
          echo "result=success" >> $GITHUB_OUTPUT

      - name: Enforce coverage threshold (≥80%)
        uses: VeryGoodOpenSource/very_good_coverage@v3
        with:
          path: coverage/lcov.info
          min_coverage: 80
          exclude: "**/*.g.dart **/generated/**"

  # Step 4: Integration tests (example app)
  integration-test:
    name: Integration Tests (example)
    runs-on: ubuntu-latest
    needs: test
    if: needs.test.outputs.tests-passed == 'success'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.29.3"
          architecture: "x64"

      - name: Install example dependencies
        run: flutter pub get
        working-directory: example

      - name: Run integration tests (host)
        run: flutter test test/
        working-directory: example
