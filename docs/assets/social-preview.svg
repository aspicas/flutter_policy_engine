</svg>
  <text x="490" y="262" font-family="'SF Pro Display','Inter','Helvetica Neue',Arial,sans-serif" font-size="66" font-weight="800" fill="#FFFFFF" letter-spacing="-1">flutter_policy_engine</text>
  <text x="490" y="352" font-family="'SF Pro Display','Inter','Helvetica Neue',Arial,sans-serif" font-size="54" font-weight="700" fill="#90CAF9">Authorization</text>
  <text x="490" y="418" font-family="'SF Pro Display','Inter','Helvetica Neue',Arial,sans-serif" font-size="54" font-weight="700" fill="#90CAF9">for Flutter apps</text>
  <rect x="0" y="603" width="1200" height="24" fill="#2EE59D"/>
