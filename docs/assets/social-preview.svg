<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="627" viewBox="0 0 1200 627" role="img" aria-labelledby="title">
  <title id="title">flutter_policy_engine — authorization for Flutter</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#12325E"/>
      <stop offset="1" stop-color="#0B1F3A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.21" cy="0.5" r="0.4">
      <stop offset="0" stop-color="#42A5F5" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#42A5F5" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="627" fill="url(#bg)"/>
  <rect width="1200" height="627" fill="url(#glow)"/>
  <svg x="40" y="103" width="420" height="420" viewBox="0 0 512 512">
  
  <defs>
    <linearGradient id="bshield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#42A5F5"/>
      <stop offset="1" stop-color="#0D47A1"/>
